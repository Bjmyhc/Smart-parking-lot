name: parking_app
description: Smart Parking Monitor System
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_swiper_view: ^1.1.8
  animated_text_kit: ^4.2.2
  flutter_spinkit: ^5.2.0
  shared_preferences: 2.2.2
  provider: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  shared_preferences_android:
    path: local_plugins/shared_preferences_android
